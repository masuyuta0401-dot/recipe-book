<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雄太のレシピ帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paprika:#EE8A2F;
    --paprika-deep:#C96A15;
    --bg:#FDF4EA;
    --surface:#FFFFFF;
    --ink:#3A2A1B;
    --ink-soft:#8A7360;
    --line:#F0DFC9;
    --gold:#F4B860;
    --radius:14px;
    --shadow:0 2px 10px rgba(160,100,40,.13);
    --font-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
    --font-display:"Shippori Mincho","Hiragino Mincho ProN",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--font-ui);
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
    padding-bottom:70px;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 14px}

  /* ---------- header ---------- */
  header{
    background:var(--paprika);
    background:linear-gradient(160deg,#F59E4C 0%,#EE8A2F 55%,#DD7519 100%);
    color:#fff;
    padding:26px 0 0;
  }
  .app-title{
    font-family:var(--font-display);
    font-size:30px;
    font-weight:800;
    letter-spacing:.08em;
    text-shadow:0 1px 0 rgba(0,0,0,.15);
  }
  .app-sub{
    font-size:13px;
    opacity:.92;
    margin-top:3px;
    letter-spacing:.02em;
  }
  nav{display:flex;gap:6px;margin-top:18px}
  .tab-btn{
    flex:1;
    padding:12px 0;
    background:rgba(255,255,255,.14);
    border:none;
    border-radius:12px 12px 0 0;
    font-family:var(--font-ui);
    font-size:15px;
    font-weight:700;
    color:rgba(255,255,255,.85);
    cursor:pointer;
  }
  .tab-btn.active{background:var(--bg);color:var(--paprika-deep);font-weight:900}
  .tab-btn:focus-visible{outline:2px solid #fff;outline-offset:-3px}

  main{padding-top:20px}
  .page{display:none}
  .page.active{display:block}

  /* ---------- controls ---------- */
  label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
  input[type=text],input[type=url],select,textarea{
    width:100%;
    font-family:var(--font-ui);
    font-size:15px;
    padding:11px 13px;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface);
    color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--paprika);outline-offset:-1px}
  textarea{resize:vertical;min-height:70px}
  .field{margin-bottom:15px}
  .field-note{font-size:12px;color:var(--ink-soft);margin-top:4px}

  .btn{
    font-family:var(--font-ui);
    font-size:15px;
    font-weight:700;
    padding:12px 22px;
    border:none;
    border-radius:999px;
    cursor:pointer;
  }
  .btn:focus-visible{outline:2px solid var(--paprika-deep);outline-offset:2px}
  .btn-primary{background:var(--paprika);color:#fff;box-shadow:var(--shadow)}
  .btn-primary:active{background:var(--paprika-deep)}
  .btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink-soft);font-size:13px;padding:8px 16px}
  .btn-danger-ghost{background:none;border:none;color:#B04A3A;font-size:12.5px;font-weight:700;cursor:pointer;padding:6px 8px}
  .btn-edit-ghost{background:none;border:none;color:var(--paprika-deep);font-size:12.5px;font-weight:700;cursor:pointer;padding:6px 8px}

  /* ---------- カテゴリーバー（一覧） ---------- */
  .cat-bar{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 0 12px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .cat-bar::-webkit-scrollbar{display:none}
  .cat-pill{
    flex:0 0 auto;
    font-family:var(--font-ui);
    font-size:13.5px;
    font-weight:700;
    padding:8px 16px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
  }
  .cat-pill.active{
    background:var(--paprika);
    border-color:var(--paprika);
    color:#fff;
    box-shadow:var(--shadow);
  }
  .cat-pill:focus-visible{outline:2px solid var(--paprika-deep);outline-offset:2px}
  .cat-pill .n{font-size:11px;opacity:.75;margin-left:4px}

  .search-row{margin-bottom:14px}
  .count-line{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px}

  /* ---------- カタロググリッド ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
  .rcard{
    background:var(--surface);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:var(--ink);
    position:relative;
  }
  .rcard-img{
    aspect-ratio:4/3;
    width:100%;
    object-fit:cover;
    display:block;
    background:#FBEBD8;
  }
  .rcard-ph{
    aspect-ratio:4/3;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:44px;
  }
  .rcard-body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column}
  .rcard-name{
    font-size:14.5px;
    font-weight:700;
    line-height:1.45;
    flex:1;
  }
  .rcard-memo{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:4px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .rcard-foot{display:flex;align-items:center;gap:6px;margin-top:9px}
  .chip{
    display:inline-block;
    font-size:10.5px;
    font-weight:800;
    padding:2px 9px 3px;
    border-radius:999px;
    white-space:nowrap;
  }
  .open-mini{
    margin-left:auto;
    font-size:12px;
    font-weight:800;
    color:var(--paprika-deep);
    text-decoration:none;
    background:#FDEBD9;
    padding:5px 12px;
    border-radius:999px;
  }
  .open-mini:focus-visible{outline:2px solid var(--paprika)}
  .manage-actions{
    display:flex;
    justify-content:flex-end;
    gap:2px;
    padding:0 8px 8px;
  }

  .cat-heading{
    font-family:var(--font-display);
    font-size:19px;
    font-weight:800;
    letter-spacing:.05em;
    margin:14px 0 0;
    padding:12px 4px;
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    background:none;
    border:none;
    color:var(--ink);
    cursor:pointer;
    text-align:left;
  }
  .cat-heading:focus-visible{outline:2px solid var(--paprika);outline-offset:2px;border-radius:8px}
  .cat-heading .cnt{font-family:var(--font-ui);font-size:12.5px;font-weight:700;color:var(--ink-soft)}
  .cat-heading .arw{font-family:var(--font-ui);font-size:13px;color:var(--paprika);transition:transform .15s}
  .cat-heading.open .arw{transform:rotate(90deg)}
  .cat-group{margin:10px 0 6px}
  @media (prefers-reduced-motion:reduce){.cat-heading .arw{transition:none}}
  .cat-heading:first-of-type{margin-top:4px}
  .cat-heading::after{
    content:'';
    flex:1;
    height:2px;
    background:repeating-linear-gradient(90deg,var(--gold) 0 8px,transparent 8px 14px);
    opacity:.55;
  }
  .cat-heading .em{font-size:22px}

  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:52px 20px;
    border:2px dashed var(--line);
    border-radius:var(--radius);
    background:rgba(255,255,255,.6);
  }
  .empty .big{font-size:40px;display:block;margin-bottom:10px}

  /* ---------- 登録フォーム ---------- */
  .form-card{
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px 16px 18px;
    margin-bottom:28px;
  }
  .form-title{
    font-family:var(--font-display);
    font-size:18px;
    font-weight:800;
    letter-spacing:.05em;
    margin-bottom:16px;
  }
  .form-pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
  .fpill{
    font-family:var(--font-ui);font-size:13px;font-weight:700;
    padding:7px 14px;border-radius:999px;
    border:1.5px solid var(--line);background:var(--surface);
    color:var(--ink-soft);cursor:pointer;
  }
  .fpill.on{background:var(--paprika);border-color:var(--paprika);color:#fff}
  .fpill:focus-visible{outline:2px solid var(--paprika-deep);outline-offset:2px}
  .cat-row{display:flex;gap:8px}
  .cat-row select{flex:1}
  .cat-row input{flex:1}
  .submit-row{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}

  .photo-drop{
    border:2px dashed var(--line);
    border-radius:var(--radius);
    padding:14px;
    text-align:center;
    cursor:pointer;
    font-size:13px;
    color:var(--ink-soft);
    background:#FEF8EF;
  }
  .photo-drop:focus-visible{outline:2px solid var(--paprika)}
  .photo-preview{
    width:100%;
    max-height:180px;
    object-fit:cover;
    border-radius:10px;
    display:none;
    margin-bottom:8px;
  }
  .photo-clear{display:none;font-size:12px;color:#A63D2F;background:none;border:none;cursor:pointer;font-weight:700;margin-top:2px}

  .section-label{
    font-family:var(--font-display);
    font-size:17px;
    font-weight:800;
    letter-spacing:.05em;
    margin:0 0 12px;
  }
  .backup-row{display:flex;gap:8px;margin-top:28px;align-items:center}

  .modal-bg{
    position:fixed;inset:0;background:rgba(40,25,10,.45);
    display:none;align-items:flex-end;justify-content:center;z-index:100;
  }
  .modal-bg.open{display:flex}
  @media(min-width:560px){.modal-bg{align-items:center}}
  .modal{
    background:var(--surface);
    width:100%;max-width:560px;
    max-height:88vh;overflow-y:auto;
    border-radius:22px 22px 0 0;
    padding-bottom:24px;
  }
  @media(min-width:560px){.modal{border-radius:22px}}
  .modal-img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
  .modal-ph{width:100%;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:64px}
  .modal-body{padding:16px 18px 0}
  .modal-name{font-family:var(--font-display);font-size:21px;font-weight:800;line-height:1.4}
  .modal-sec{
    font-family:var(--font-display);font-size:15.5px;font-weight:800;
    margin:18px 0 8px;padding-left:9px;border-left:4px solid var(--paprika);
  }
  .modal-pre{font-size:14px;white-space:pre-wrap;line-height:1.75}
  .modal-steps{list-style:none;counter-reset:st}
  .modal-steps li{
    counter-increment:st;position:relative;padding-left:32px;margin-bottom:10px;
    font-size:14px;line-height:1.7;
  }
  .modal-steps li::before{
    content:counter(st);
    position:absolute;left:0;top:2px;
    width:22px;height:22px;border-radius:50%;
    background:var(--paprika);color:#fff;
    font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }
  .modal-actions{display:flex;gap:8px;padding:18px 18px 0;align-items:center}
  .modal-close{
    position:sticky;top:10px;margin:10px 10px 0 auto;display:block;
    width:34px;height:34px;border-radius:50%;border:none;
    background:rgba(255,255,255,.92);box-shadow:var(--shadow);
    font-size:17px;font-weight:800;color:var(--ink-soft);cursor:pointer;z-index:2;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:26px;
    transform:translateX(-50%) translateY(8px);
    background:var(--ink);
    color:#fff;
    font-size:13.5px;
    font-weight:700;
    padding:10px 20px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s,transform .2s;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1 class="app-title">雄太のレシピ帳</h1>
    <p class="app-sub">「あれ、また作りたい」がすぐ見つかる、わが家の料理カタログ</p>
    <nav>
      <button class="tab-btn active" id="tabList" onclick="showPage('list')">カタログ</button>
      <button class="tab-btn" id="tabAdd" onclick="showPage('add')">レシピを登録</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- ============ カタログページ ============ -->
  <section class="page active" id="pageList">
    <div class="cat-bar" id="catBar"></div>
    <div class="search-row">
      <input type="text" id="searchBox" placeholder="🔍 料理名・メモを検索" oninput="renderList()" aria-label="検索">
    </div>
    <p class="count-line" id="countLine"></p>
    <div id="listArea"></div>
  </section>

  <!-- ============ 登録ページ ============ -->
  <section class="page" id="pageAdd">
    <div class="form-card">
      <p class="form-title" id="formTitle">レシピを登録</p>
      <div class="field">
        <label for="inUrl">レシピのURL</label>
        <div class="cat-row">
          <input type="url" id="inUrl" placeholder="URLを貼るだけで下が自動入力されます" oninput="autoFetchOnPaste()">
          <button class="btn btn-ghost" id="fetchBtn" style="flex:0 0 auto;white-space:nowrap" onclick="fetchFromUrl()">再取得</button>
        </div>
        <p class="field-note">料理名・カテゴリー・写真を自動で入力します（クックパッド・クラシル等）。インスタはログイン制のため取得できない場合が多いです</p>
      </div>
      <div class="field">
        <label for="inName">料理名</label>
        <input type="text" id="inName" placeholder="例：ヤンニョムチキン">
      </div>
      <div class="field">
        <label>カテゴリー（複数選択OK）</label>
        <div class="form-pills" id="catPills"></div>
        <div class="cat-row">
          <input type="text" id="inCatNew" placeholder="新しいカテゴリーを追加">
          <button class="btn btn-ghost" style="flex:0 0 auto;white-space:nowrap" onclick="addNewCat()">追加</button>
        </div>
      </div>
      <div class="field">
        <label>写真（任意）</label>
        <img id="photoPreview" class="photo-preview" alt="料理の写真プレビュー">
        <div class="photo-drop" id="photoDrop" tabindex="0" role="button"
             onclick="document.getElementById('photoFile').click()"
             onkeydown="if(event.key==='Enter')document.getElementById('photoFile').click()">
          📷 タップして料理の写真を追加
        </div>
        <button class="photo-clear" id="photoClear" onclick="clearPhoto()">写真を削除</button>
        <input type="file" id="photoFile" accept="image/*" style="display:none" onchange="onPhotoPick(event)">
      </div>
      <div class="field">
        <label for="inIng">材料・分量（任意）</label>
        <textarea id="inIng" placeholder="例：鶏もも肉 300g&#10;コチュジャン 大さじ2&#10;（URLから自動で入る場合があります）"></textarea>
      </div>
      <div class="field">
        <label for="inSteps">作り方（任意）</label>
        <textarea id="inSteps" style="min-height:100px" placeholder="1行＝1手順で書くと番号付きで表示されます"></textarea>
      </div>
      <div class="field">
        <label for="inMemo">メモ（任意）</label>
        <textarea id="inMemo" placeholder="例：砂糖は半分でいい／子ども向けは辛味なし"></textarea>
      </div>
      <div class="submit-row">
        <button class="btn btn-ghost" id="cancelEditBtn" style="display:none" onclick="cancelEdit()">キャンセル</button>
        <button class="btn btn-primary" id="saveBtn" onclick="saveRecipe()">保存する</button>
      </div>
    </div>

    <p class="section-label">登録済みのレシピ</p>
    <div id="manageArea"></div>

    <div class="backup-row">
      <button class="btn btn-ghost" onclick="exportData()">バックアップを書き出す</button>
      <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">読み込む</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </section>

</main>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeDetail()">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
/* ============ クラウド同期設定（Supabase） ============
   下の2行に自分のSupabaseの値を貼ると、PC・スマホ間でデータが共有される。
   空のままならこれまで通り端末内保存のみで動く。 */
const SUPA_URL = '';   // 例: 'https://xxxx.supabase.co'
const SUPA_KEY = '';   // Settings > API の anon public キー

const useSupa = () => SUPA_URL && SUPA_KEY;
async function supaFetch(path, opts={}){
  const res = await fetch(SUPA_URL + '/rest/v1/' + path, {
    ...opts,
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json',
      ...(opts.headers||{})
    }
  });
  if(!res.ok) throw new Error('supabase ' + res.status);
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}
async function supaPull(){
  const rows = await supaFetch('recipes?select=id,data&order=ts.desc');
  return rows.map(r=>r.data);
}
async function supaUpsert(recipe){
  await supaFetch('recipes?on_conflict=id', {
    method:'POST',
    headers:{'Prefer':'resolution=merge-duplicates'},
    body: JSON.stringify([{id: recipe.id, data: recipe, ts: new Date().toISOString()}])
  });
}
async function supaDelete(id){
  await supaFetch('recipes?id=eq.' + encodeURIComponent(id), {method:'DELETE'});
}
/* 失敗しても端末内には保存済みなので、通知だけして続行 */
function syncSafe(promise){
  if(!useSupa()) return;
  promise.catch(()=>toast('クラウド同期に失敗（この端末には保存済み）'));
}

/* ============ ストレージ ============ */
const KEY = 'recipeBook_v1';
let memFallback = null;
function loadData(){
  try{
    const raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : {recipes:[]};
  }catch(e){ return memFallback || {recipes:[]}; }
}
function saveData(d){
  try{ localStorage.setItem(KEY, JSON.stringify(d)); }
  catch(e){
    memFallback = d;
    toast('保存容量がいっぱいです。写真の少ない登録をおすすめします');
  }
}

let data = loadData();
/* 旧データ(cat文字列)を cats配列へ移行。catは先頭カテゴリーとして維持（後方互換） */
(function migrate(){
  let changed = false;
  for(const r of data.recipes){
    if(!Array.isArray(r.cats)){ r.cats = r.cat ? [r.cat] : []; changed = true; }
    if(r.cat !== (r.cats[0]||'')){ r.cat = r.cats[0]||''; changed = true; }
  }
  if(changed) saveData(data);
})();
let editingId = null;
let currentCat = '';       // '' = すべて
let pendingPhoto = null;   // 編集中フォームの写真(base64)

/* ============ ユーティリティ ============ */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const PRESET_CATS = [
  '和食','洋食','中華','韓国料理','イタリアン','エスニック・アジア',
  '肉料理','魚料理','野菜・サラダ','スープ・汁物','麺類','ご飯もの・丼',
  '鍋','カレー','パン・朝食','おつまみ','お弁当','作り置き','離乳食','デザート・おやつ','その他'
];
/* 登録フォーム用：プリセット＋ユーザー追加分 */
function allCategories(){
  const extras = [...new Set([...data.recipes.flatMap(r=>r.cats||[]), ...extraCats])]
    .filter(c=>!PRESET_CATS.includes(c))
    .sort((a,b)=>a.localeCompare(b,'ja'));
  return [...PRESET_CATS, ...extras];
}
/* カタログ用：レシピが1件以上あるカテゴリーのみ（プリセット順） */
function categories(){
  const used = new Set(data.recipes.flatMap(r => r.cats||[]));
  return allCategories().filter(c=>used.has(c));
}
let extraCats = [];   // 未保存の新規カテゴリー（保存前にピルとして出すため）
let selectedCats = new Set();
/* カテゴリー配色（暖色系で食欲がわくトーン） */
const CHIP_COLORS = [
  ['#FBE3DC','#8E2A1F'], // パプリカ
  ['#F7ECD3','#7A5A10'], // 蜂蜜
  ['#E4F0E2','#2C5A32'], // ハーブ
  ['#FBE6EE','#8A2C52'], // ビーツ
  ['#E7ECF6','#2C446E'], // 藍
  ['#F0E6F4','#5A3472'], // 茄子
  ['#E0F1EE','#1F5C55'], // 青磁
  ['#F6E7DA','#7A4218'], // シナモン
];
function chipStyle(cat){
  let h = 0;
  for(const ch of cat) h = (h*31 + ch.codePointAt(0)) >>> 0;
  const [bg,fg] = CHIP_COLORS[h % CHIP_COLORS.length];
  return `background:${bg};color:${fg}`;
}
/* カテゴリー名から絵文字を推定（写真なしカードのプレースホルダ） */
const EMOJI_RULES = [
  [/韓国/,'🌶️'],[/中華|中国/,'🥟'],[/魚|海鮮|さかな/,'🐟'],[/肉|チキン|鶏|豚|牛/,'🍖'],
  [/麺|パスタ|うどん|そば|ラーメン/,'🍜'],[/和食|和風/,'🍱'],[/イタリア/,'🍝'],
  [/カレー|インド/,'🍛'],[/サラダ|野菜/,'🥗'],[/スープ|汁/,'🍲'],[/丼|ごはん|米/,'🍚'],
  [/パン|朝食/,'🥐'],[/洋食/,'🍽️'],[/エスニック|アジア|タイ|ベトナム/,'🍤'],[/おつまみ|酒/,'🍺'],[/弁当/,'🍱'],[/作り置き/,'🥡'],[/離乳食|ベビー|赤ちゃん/,'🍼'],[/デザート|おやつ|スイーツ|お菓子/,'🍰'],[/朝/,'🍳'],[/鍋/,'🍲'],
];
function catEmoji(cat){
  for(const [re,em] of EMOJI_RULES) if(re.test(cat)) return em;
  let h=0; for(const ch of cat) h=(h*31+ch.codePointAt(0))>>>0;
  return ['🍽️','🥘','🍴','🧑‍🍳'][h%4];
}

  t.textContent = msg;

}

function onPhotoPick(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    const MAX = 720;
    const scale = Math.min(1, MAX/Math.max(img.width,img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width*scale);
    cv.height = Math.round(img.height*scale);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    pendingPhoto = cv.toDataURL('image/jpeg',0.72);
    URL.revokeObjectURL(url);
    showPhotoPreview();
  };
  img.src = url;
  ev.target.value = '';
}
function showPhotoPreview(){
  const pv = document.getElementById('photoPreview');
  const clear = document.getElementById('photoClear');
  if(pendingPhoto){
    pv.src = pendingPhoto; pv.style.display='block'; clear.style.display='inline-block';
    document.getElementById('photoDrop').textContent='📷 タップして写真を変更';
  }else{
    pv.style.display='none'; clear.style.display='none';
    document.getElementById('photoDrop').textContent='📷 タップして料理の写真を追加';
  }
}

/* ============ URL自動入力 ============ */
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
];
async function fetchViaProxy(url, asBlob){
  for(const make of PROXIES){
    try{
      const ctrl = new AbortController();
      const tm = setTimeout(()=>ctrl.abort(), 12000);
      const res = await fetch(make(url), {signal: ctrl.signal});
      clearTimeout(tm);
      if(!res.ok) continue;
      return asBlob ? await res.blob() : await res.text();
    }catch(e){ /* 次のプロキシへ */ }
  }
  return null;
}
async function fetchViaProxy2(u){
  try{
    const ctrl = new AbortController();
    const tm = setTimeout(()=>ctrl.abort(), 12000);
    const res = await fetch(u, {signal: ctrl.signal});
    clearTimeout(tm);
    if(res.ok) return await res.text();
  }catch(e){}
  return null;
}

    .replace(/\s*by\s*\S+\s*$/i,'')

/* タイトルからカテゴリーを推定（具体的な料理名→一般語の順） */
const CAT_GUESS = [
  [/離乳食|ベビー|赤ちゃん|月齢/,'離乳食'],
  [/作り置き|常備菜/,'作り置き'],
  [/弁当/,'お弁当'],

  [/キムチ|チヂミ|ヤンニョム|ビビンバ|プルコギ|チゲ|サムギョプサル|トッポギ|韓国/,'韓国料理'],
  [/麻婆|餃子|回鍋肉|青椒|エビチリ|担々|シュウマイ|春巻|酢豚|中華/,'中華'],
  [/パスタ|カルボナーラ|ペペロン|ボロネーゼ|ジェノベーゼ|リゾット|ピザ|イタリア/,'イタリアン'],
  [/ガパオ|フォー|ナシゴレン|トムヤム|タコス|エスニック|タイ風/,'エスニック・アジア'],
  [/カレー/,'カレー'],
  [/グラタン|シチュー|オムライス|ロールキャベツ|ドリア|ムニエル|ポトフ/,'洋食'],
  [/鍋|おでん/,'鍋'],
  [/うどん|そば|ラーメン|焼きそば|そうめん|冷麺|麺/,'麺類'],
  [/丼|炊き込み|おにぎり|チャーハン|オムライス|ピラフ|炒飯/,'ご飯もの・丼'],
  [/スープ|味噌汁|ポタージュ|豚汁|汁物/,'スープ・汁物'],
  [/サラダ|ナムル|マリネ|おひたし|和え物/,'野菜・サラダ'],
  [/パン|トースト|サンドイッチ|ホットケーキ|パンケーキ|朝食/,'パン・朝食'],
  [/ケーキ|クッキー|プリン|マフィン|ゼリー|スイーツ|デザート|おやつ|タルト|シフォン/,'デザート・おやつ'],
  [/鮭|サーモン|さば|サバ|鯖|ぶり|ブリ|たら|タラ|鯛|あじ|アジ|いわし|イワシ|さんま|サンマ|まぐろ|マグロ|刺身|えび|エビ|海老|いか|イカ|ほたて|ホタテ|しらす|カキ|牡蠣|魚/,'魚料理'],
  [/鶏|チキン|豚|牛|ハンバーグ|唐揚げ|から揚げ|からあげ|ステーキ|生姜焼き|角煮|ミートボール|つくね|肉/,'肉料理'],
  [/肉じゃが|きんぴら|煮物|筑前煮|照り焼き|南蛮|竜田|和風|和食/,'和食'],
];
function guessCategories(text){
  const hits = [];
  for(const [re,cat] of CAT_GUESS){
    if(re.test(text) && !hits.includes(cat)) hits.push(cat);
    if(hits.length>=3) break;
  }
  return hits;
}
let catTouched = false;   // ユーザーが手動でカテゴリーを選んだら自動推定で上書きしない

let _autoFetchTm = null;
let _lastFetchedUrl = '';
function autoFetchOnPaste(){
  clearTimeout(_autoFetchTm);
  _autoFetchTm = setTimeout(()=>{
    const url = document.getElementById('inUrl').value.trim();
    if(!/^https?:\/\//.test(url)) return;
    if(url === _lastFetchedUrl) return;   // 同じURLで連続実行しない
    _lastFetchedUrl = url;
    fetchFromUrl();
  }, 600);
}
async function fetchFromUrl(){
  const url = document.getElementById('inUrl').value.trim();
  if(!/^https?:\/\//.test(url)){ toast('先にURLを貼り付けてください'); return; }
  const btn = document.getElementById('fetchBtn');
  btn.disabled = true; btn.textContent = '取得中…';
  const isInsta = /instagram\.com|instagr\.am/.test(url);
  try{
    let title = '', image = '';
    let got = [];
    const html = await fetchViaProxy(url, false);
    if(html){
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const og = p => doc.querySelector(`meta[property="${p}"]`)?.content
                 || doc.querySelector(`meta[name="${p}"]`)?.content || '';
      title = cleanTitle(og('og:title') || doc.title || '');
      image = og('og:image');
      /* ログイン画面にリダイレクトされたケースを検出 */
      if(/ログイン|Log in|Login/i.test(title)) { title=''; image=''; }
      /* schema.org/Recipe から材料・作り方を抽出 */
      try{
        for(const sc of doc.querySelectorAll('script[type="application/ld+json"]')){
          let j; try{ j = JSON.parse(sc.textContent); }catch(e){ continue; }
          const nodes = [].concat(j['@graph']||j);
          const rec = nodes.flat().find(n=>n && /Recipe/.test(String(n['@type'])));
          if(!rec) continue;
          if(Array.isArray(rec.recipeIngredient) && !document.getElementById('inIng').value.trim()){
            const yieldTxt = rec.recipeYield ? `【${[].concat(rec.recipeYield)[0]}】\n` : '';
            document.getElementById('inIng').value = yieldTxt + rec.recipeIngredient.join('\n');
            got.push('材料');
          }
          const inst = rec.recipeInstructions;
          if(inst && !document.getElementById('inSteps').value.trim()){
            const lines = [].concat(inst).flatMap(x=>{
              if(typeof x==='string') return [x];
              if(x && x.text) return [x.text];
              if(x && Array.isArray(x.itemListElement)) return x.itemListElement.map(y=>y.text||'').filter(Boolean);
              return [];
            }).map(t=>t.trim()).filter(Boolean);
            if(lines.length){
              document.getElementById('inSteps').value = lines.join('\n');
              got.push('作り方');
            }
          }
          break;
        }
      }catch(e){}
      /* JSON-LDで取れなかった場合：class/idから材料・手順を推測して抽出 */
      try{
        if(!document.getElementById('inIng').value.trim()){
          const lines = [...doc.querySelectorAll('[class*="ingredient" i] li, [id*="ingredient" i] li, [class*="ingredient" i] [class*="row" i]')]
            .map(e=>e.textContent.replace(/\s+/g,' ').trim())
            .filter(t=>t && t.length<=60);
          const uniq = [...new Set(lines)];
          if(uniq.length>=2) document.getElementById('inIng').value = uniq.join('\n'), got.push('材料');
        }
        if(!document.getElementById('inSteps').value.trim()){
          const lines = [...doc.querySelectorAll('[class*="step" i] li, [id*="step" i] li, ol[class*="instruction" i] li')]
            .map(e=>e.textContent.replace(/\s+/g,' ').trim())
            .filter(t=>t && t.length>=5 && t.length<=500);
          const uniq = [...new Set(lines)];
          if(uniq.length>=2) document.getElementById('inSteps').value = uniq.join('\n'), got.push('作り方');
        }
      }catch(e){}
    }
    /* HTML経由で取れなければ jina reader でタイトルだけ再挑戦 */
    if(!title || (!document.getElementById('inIng').value.trim() && !document.getElementById('inSteps').value.trim())){
      const md = await fetchViaProxy2('https://r.jina.ai/' + url);
      if(md){
        if(!title){
          const m = md.match(/^Title:\s*(.+)$/m);
          if(m) title = cleanTitle(m[1]);
        }
        if(!image){
          const im = md.match(/!\[[^\]]*\]\((https?:[^)\s]+)\)/);
          if(im) image = im[1];
        }
        if(!document.getElementById('inIng').value.trim()){
          const sec = md.match(/材料[^\n]*\n([\s\S]{0,1500}?)(?=\n#{1,3} |\n作り方|\n手順|$)/);
          if(sec){
            const lines = sec[1].split('\n')
              .map(t=>t.replace(/^[-*・\d\.\)\s]+/,'').trim())
              .filter(t=>t && t.length<=60 && !/^!\[|^http/.test(t));
            if(lines.length>=2){ document.getElementById('inIng').value = lines.join('\n'); got.push('材料'); }
          }
        }
        if(!document.getElementById('inSteps').value.trim()){
          const sec = md.match(/(?:作り方|手順)[^\n]*\n([\s\S]{0,4000}?)(?=\n#{1,3} |$)/);
          if(sec){
            const lines = sec[1].split('\n')
              .map(t=>t.replace(/^[-*・\d\.\)\s]+/,'').trim())
              .filter(t=>t && t.length>=5 && t.length<=500 && !/^!\[|^http/.test(t));
            if(lines.length>=2){ document.getElementById('inSteps').value = lines.join('\n'); got.push('作り方'); }
          }
        }
      }
    }
    if(!title && !image){
      toast(isInsta
        ? 'インスタは取得できませんでした。ログインしていても外部からは読めない仕組みです。スクショを📷から登録してください'
        : 'ページを取得できませんでした。少し待って「再取得」を押してください');
      return;
    }
    if(title && !document.getElementById('inName').value.trim()){
      document.getElementById('inName').value = title;
      got.push('料理名');
    }
    if(!catTouched && !editingId){
      const guessed = guessCategories(title + ' ' + url);
      if(guessed.length){
        selectedCats = new Set(guessed);
        renderCatPills();
        got.push('カテゴリー');
      }
    }
    if(image){
      const imgUrl = new URL(image, url).href;
      /* 画像はCORS対応の画像プロキシを優先（成功率が高い） */
      let blob = null;
      try{
        const ctrl = new AbortController();
        const tm = setTimeout(()=>ctrl.abort(), 12000);
        const wr = await fetch('https://images.weserv.nl/?url=' + encodeURIComponent(imgUrl.replace(/^https?:\/\//,'')) + '&w=720', {signal:ctrl.signal});
        clearTimeout(tm);
        if(wr.ok) blob = await wr.blob();
      }catch(e){}
      if(!blob || !blob.type.startsWith('image')) blob = await fetchViaProxy(imgUrl, true);
      if(blob && blob.type.startsWith('image')){
        await new Promise(resolve=>{
          const img = new Image();
          const bu = URL.createObjectURL(blob);
          img.onload = ()=>{
            const MAX = 720;
            const scale = Math.min(1, MAX/Math.max(img.width,img.height));
            const cv = document.createElement('canvas');
            cv.width = Math.round(img.width*scale);
            cv.height = Math.round(img.height*scale);
            cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
            pendingPhoto = cv.toDataURL('image/jpeg',0.72);
            URL.revokeObjectURL(bu);
            showPhotoPreview();
            got.push('写真');
            resolve();
          };
          img.onerror = resolve;
          img.src = bu;
        });
      }
    }
    toast(got.length ? got.join('と')+'を取得しました' : 'タイトル・写真が見つかりませんでした。手入力してください');
  }finally{
    btn.disabled = false; btn.textContent = '自動入力';
  }
}

/* ============ バックアップ ============ */
function exportData(){
  const blob = new Blob([JSON.stringify(data)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const d = new Date();
  a.download = `recipe_book_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const imported = JSON.parse(reader.result);
      if(!Array.isArray(imported.recipes)) throw new Error();
      const ids = new Set(data.recipes.map(r=>r.id));
      let added = 0;
      for(const r of imported.recipes){
        if(!ids.has(r.id)){ data.recipes.push(r); added++; }
      }
      saveData(data);
      if(useSupa()) for(const r of data.recipes) syncSafe(supaUpsert(r));
      renderManage();
      toast(`${added}件を読み込みました`);
    }catch(e){
      toast('ファイルを読み込めませんでした');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

/* ============ 初期化 ============ */
renderList();
renderCatPills();
(async function initSync(){
  if(!useSupa()) return;
  try{
    const remote = await supaPull();
    if(remote.length === 0 && data.recipes.length > 0){
      /* クラウドが空でローカルにデータがある＝初回。ローカルを全部アップ */
      for(const r of data.recipes) await supaUpsert(r);
      toast('この端末のレシピをクラウドへ同期しました');
    }else{
      /* クラウドを正として表示。ローカルにも控えを保存 */
      data.recipes = remote;
      for(const r of data.recipes){
        if(!Array.isArray(r.cats)) r.cats = r.cat ? [r.cat] : [];
        r.cat = r.cats[0]||'';
      }
      saveData(data);
      renderList();
      renderManage();
    }
  }catch(e){
    toast('クラウドに接続できません（端末内データで表示中）');
  }
})();
</script>
